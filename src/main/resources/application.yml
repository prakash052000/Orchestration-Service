server:
  port: 9191
  servlet:
    context-path: /OrchestrationService

spring:
  application:
    name: OrchestrationService
  cloud:
    compatibility-verifier:
      enabled: false
  boot:
    admin:
      client:
        url: http://localhost:8081
        instance:
          service-base-url: http://localhost:9191
          prefer-ip: false
          metadata:
            unique-name: OrchestrationService
            service-type: orchestration
  main:
    allow-bean-definition-overriding: true
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
  mvc:
    pathmatch:
      matching-strategy: path_pattern_parser

info:
  app:
    name: OrchestrationService
    type: orchestration
    port: 9191

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: OrchestrationService

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: OrchestrationService:9191
    prefer-ip-address: false
    hostname: localhost
    metadata-map:
      unique-name: OrchestrationService
      service-type: orchestration
      port: 9191
      management.context-path: /OrchestrationService/actuator

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
  packages-to-scan: com.orchestration
  paths-to-match: /**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# WeCoreMotorApi portal user (login_master in wecorelive). Do not use the RDS DB user here.
wecore:
  login-id: GRPZAM
  password: ${WECORE_LOGIN_PASSWORD:}
